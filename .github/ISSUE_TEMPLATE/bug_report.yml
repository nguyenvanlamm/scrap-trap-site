name: Bug report
description: Tell us what broke and how to reproduce it
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Scrap Trap. Please do not include passwords, personal data, account identifiers or sensitive logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed result and the level or screen context.
      placeholder: Tell us what you saw.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Device family only; do not include identifiers.
      placeholder: "Example: iPhone 15 or Pixel 8"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the OS version if known.
      placeholder: "Example: iOS 18 or Android 15"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version and build
      description: Include the version if known; leave blank for website reports.
      placeholder: "Example: 1.0.0+1"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that makes the issue appear.
      placeholder: |
        1. Open...
        2. Reach...
        3. Tap...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you think should happen?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add a redacted screenshot or detail only if it is safe to make public.
    validations:
      required: false
