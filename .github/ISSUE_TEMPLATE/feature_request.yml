name: Feature request
description: Suggest a player-focused improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please explain the player problem before the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Player problem
      description: What feels missing, difficult or unclear?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior or experience you want.
      placeholder: I would like Scrap Trap to...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and alternatives
      description: Include a level, control, accessibility or language context when relevant.
    validations:
      required: false
