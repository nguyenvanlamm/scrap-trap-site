name: Feedback
description: Share a clear reaction to the current build
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Public feedback is welcome. Do not include passwords, personal data, account identifiers or sensitive logs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What are you reacting to?
      options:
        - Level or traps
        - Controls
        - Audio or accessibility
        - Website or language
        - Other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Tell us what worked, what did not and why.
      placeholder: The moment that stood out was...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Optional context
      description: Include a level or device family only if useful; no identifiers or private data.
    validations:
      required: false
